# Cloudflare Origin Certificate ile TLS sonlandirma.
# Cloudflare "Full (strict)" modunda bu sertifikayi dogrular.
server {
    listen 443 ssl;
    http2 on;
    server_name mabridgeglobal.com www.mabridgeglobal.com _;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gercek ziyaretci IP'si Cloudflare basligindan alinir
    real_ip_header CF-Connecting-IP;

    location /api/ {
        set $be backend:5000;
        proxy_pass http://$be;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        set $be backend:5000;
        proxy_pass http://$be;
    }

    location /admin/ {
        set $adm admin;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$adm;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $fe frontend;
        proxy_pass http://$fe;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
